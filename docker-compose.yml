version: '3.8'

networks:
  internal:
    driver: bridge
    internal: false
  monitoring:
    driver: bridge

services:
  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - QUEUE_SERVICE_URL=http://queue-service:8081
      - CLIENT_TIMEOUT=30
      - READ_TIMEOUT=5
      - WRITE_TIMEOUT=10
      - IDLE_TIMEOUT=120
      - SHUTDOWN_TIMEOUT=10
      - LOG_LEVEL=info
    networks:
      - internal
    depends_on:
      - queue-service
    restart: unless-stopped

  queue-service:
    build:
      context: .
      dockerfile: services/queue-service/Dockerfile
    container_name: queue-service
    ports:
      - "8081:8081"
    environment:
      - PORT=8081
      - READ_TIMEOUT=5
      - WRITE_TIMEOUT=10
      - IDLE_TIMEOUT=120
      - SHUTDOWN_TIMEOUT=10
      - LOG_LEVEL=info
      - KAFKA_ENABLED=true
      - KAFKA_BROKERS=kafka:9092
      - KAFKA_TOPIC=tasks
      - STORE_TYPE=memory
    networks:
      - internal
    depends_on:
      - kafka
    restart: unless-stopped

  worker-service:
    build:
      context: .
      dockerfile: services/worker-service/Dockerfile
    container_name: worker-service
    ports:
      - "8082:8082"
    environment:
      - PORT=8082
      - QUEUE_SERVICE_URL=http://queue-service:8081
      - POLL_INTERVAL=5
      - BATCH_SIZE=10
      - READ_TIMEOUT=5
      - WRITE_TIMEOUT=10
      - IDLE_TIMEOUT=120
      - SHUTDOWN_TIMEOUT=10
      - LOG_LEVEL=info
      - WORKER_MODE=kafka
      - KAFKA_ENABLED=true
      - KAFKA_BROKERS=kafka:9092
      - KAFKA_TOPIC=tasks
      - KAFKA_CONSUMER_GROUP=worker-group
    networks:
      - internal
    depends_on:
      - queue-service
      - kafka
    restart: unless-stopped

  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - internal
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: kafka
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"
    networks:
      - internal
    restart: unless-stopped

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    ports:
      - "8083:8080"
    networks:
      - internal
    restart: unless-stopped