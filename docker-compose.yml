networks:
  internal:
    driver: bridge
  # monitoring:
  #   driver: bridge

services:
  # ============================================
  # API Gateway
  # ============================================
  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - QUEUE_SERVICE_URL=http://queue-service:8081
      - CLIENT_TIMEOUT=30
      - READ_TIMEOUT=5
      - WRITE_TIMEOUT=10
      - IDLE_TIMEOUT=120
      - SHUTDOWN_TIMEOUT=10
      - LOG_LEVEL=info
      # - CLICKHOUSE_ENABLED=true
      # - CLICKHOUSE_HOST=clickhouse
      # - CLICKHOUSE_PORT=9000
      # - CLICKHOUSE_DATABASE=analytics
      # - CLICKHOUSE_USER=default
      # - CLICKHOUSE_PASSWORD=
    networks:
      - internal
    depends_on:
      - queue-service
    restart: unless-stopped

  # ============================================
  # Queue Service
  # ============================================
  queue-service:
    build:
      context: .
      dockerfile: services/queue-service/Dockerfile
    container_name: queue-service
    ports:
      - "8081:8081"
    environment:
      - PORT=8081
      - READ_TIMEOUT=5
      - WRITE_TIMEOUT=10
      - IDLE_TIMEOUT=120
      - SHUTDOWN_TIMEOUT=10
      - LOG_LEVEL=info
      - KAFKA_ENABLED=false
      # - KAFKA_BROKERS=kafka:9092
      # - KAFKA_TOPIC=tasks
      - STORE_TYPE=memory
    networks:
      - internal
    # depends_on:
    #   - kafka
    restart: unless-stopped

  # ============================================
  # Worker Service
  # ============================================
  worker-service:
    build:
      context: .
      dockerfile: services/worker-service/Dockerfile
    container_name: worker-service
    ports:
      - "8082:8082"
    environment:
      - PORT=8082
      - QUEUE_SERVICE_URL=http://queue-service:8081
      - POLL_INTERVAL=5
      - BATCH_SIZE=10
      - READ_TIMEOUT=5
      - WRITE_TIMEOUT=10
      - IDLE_TIMEOUT=120
      - SHUTDOWN_TIMEOUT=10
      - LOG_LEVEL=info
      - WORKER_MODE=polling
      - KAFKA_ENABLED=false
      # - KAFKA_BROKERS=kafka:9092
      # - KAFKA_TOPIC=tasks
      # - KAFKA_CONSUMER_GROUP=worker-group
      # - CLICKHOUSE_ENABLED=true
      # - CLICKHOUSE_HOST=clickhouse
      # - CLICKHOUSE_PORT=9000
      # - CLICKHOUSE_DATABASE=analytics
      # - CLICKHOUSE_USER=default
      # - CLICKHOUSE_PASSWORD=
    networks:
      - internal
    depends_on:
      - queue-service
      # - kafka
      # - clickhouse
    restart: unless-stopped

